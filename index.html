<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fertex Vendas</title>
    <meta name="description" content="Fertex Vendas — acelerador de vendas: cadastre produtos, venda e acompanhe seus resultados." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fertex" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Aplica o tema antes da renderização para evitar "piscar"
      try {
        var t = localStorage.getItem('fertex-tema')
        if (t === 'escuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ative o JavaScript para usar o Fertex Vendas.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
