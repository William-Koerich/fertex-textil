<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- og:inicio (substituído pelo middleware.ts na Vercel para os robôs de prévia de links) -->
    <title>Fertex Vendas</title>
    <meta name="description" content="Catálogo de produtos com pedido pelo WhatsApp." />
    <meta property="og:site_name" content="Fertex Vendas" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fertex Vendas · Catálogo e pedidos pelo WhatsApp" />
    <meta property="og:description" content="Veja o catálogo e faça seu pedido pelo WhatsApp." />
    <meta property="og:image" content="/api/og" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:fim -->
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fertex" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Recuperação: se um script do app não carregar (ex.: cópia antiga/corrompida guardada pelo service worker
      // depois de uma nova publicação), apaga as cópias guardadas e recarrega uma única vez.
      window.addEventListener(
        'error',
        function (e) {
          var el = e.target
          if (!el || el.tagName !== 'SCRIPT' || !/\/assets\//.test(el.src || '')) return
          try {
            if (sessionStorage.getItem('fertex-recuperado')) return
            sessionStorage.setItem('fertex-recuperado', '1')
          } catch (x) {
            return
          }
          var limpar = []
          if (navigator.serviceWorker) limpar.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }))
          if (window.caches) limpar.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) }))
          Promise.all(limpar).catch(function () {}).then(function () { location.reload() })
        },
        true,
      )
    </script>
    <script>
      // Aplica o tema antes da renderização para evitar "piscar"
      try {
        var t = localStorage.getItem('fertex-tema')
        if (t === 'escuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark'), document.querySelector('meta[name=theme-color]').setAttribute('content', '#0f172a')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ative o JavaScript para usar o Fertex Vendas.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
